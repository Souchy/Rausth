[package]
name = "Rausth"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
once_cell = "1.21.3"
redis = { version = "0.32.4", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.12.22", features = ["json"] }
serde = "1.0.219"
serde_json = "1.0.141"
tokio = "1.47.0"
url = "2.5.4"
vercel_runtime = "1.1.6"
# copilot
async-trait = "0.1"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
bcrypt = "0.15"
jsonwebtoken = "9.0"
config = "0.13"

# Each handler has to be specified as [[bin]]
[[bin]]
name = "signin"
path = "api/get_login_url.rs"


# Each handler has to be specified as [[bin]]
[[bin]]
name = "refresh"
path = "api/refresh_access.rs"


# Each handler has to be specified as [[bin]]
[[bin]]
name = "callback"
path = "api/exchange_code.rs"
